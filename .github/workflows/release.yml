name: Wydanie wtyczki
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Typ zmiany wersji
        type: choice
        options: [patch, minor, major]
        required: true
permissions:
  contents: read
concurrency:
  group: release-main
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Zaktualizuj wersję i opublikuj wydanie
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          version="$(python3 scripts/prepare-release.py "$BUMP")"
          tag="v$version"
          node --input-type=module --check < dist/dynamic-weather-background.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/dynamic-weather-background.js README.md CHANGELOG.md
          git commit -m "release: $tag"
          git tag "$tag"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$tag"
          awk -v version="$version" '
            $1 == "##" && $2 == version { notes = 1; next }
            /^## / && notes { exit }
            notes { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" --verify-tag --title "$tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md" dist/dynamic-weather-background.js
